version: 2

models:
  - name: dim_store
    description: One row per store.
    columns:
      - name: store_key
        data_tests: [unique, not_null]

  - name: dim_date
    description: One row per week.
    columns:
      - name: date_key
        data_tests: [unique, not_null]

  - name: fct_weekly_sales
    description: Weekly sales per store and department.
    columns:
      - name: store_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_key
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
